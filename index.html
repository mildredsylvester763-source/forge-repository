<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORGE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#050c0d;--p:#0b1819;--p2:#10252a;--b:#1c3436;--t:#e6f1f0;--m:#7f9a9a;--o:#f58a1f;--g:#2dd4a0}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--t);font-size:13px}
button{cursor:pointer;color:inherit;background:none;border:0;font-size:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.go{cursor:pointer;transition:.15s}.go:hover{border-color:var(--g)!important}.go:active{transform:scale(.97)}
.app{display:grid;grid-template-columns:210px 1fr;height:100%}
.side{background:#071213;border-right:1px solid var(--b);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.logo{font-weight:800;letter-spacing:3px;font-size:15px;padding:4px 8px 14px;display:flex;gap:8px;align-items:center}.logo svg{color:var(--o)}
.ni{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:#b9cccb;text-align:left;width:100%;border:1px solid transparent}
.ni svg{color:var(--m)}.ni:hover{background:var(--p2)}.ni.on{background:#103033;color:#fff;border-color:#1f5b55}.ni.on svg{color:var(--g)}
.sw{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px}
.sw .go{border:1px solid var(--b);border-radius:8px;padding:8px;background:var(--p);font-size:11px}.sw small{display:block;color:var(--m)}
.user{display:flex;gap:8px;align-items:center;padding:8px 4px;font-size:11px}.av{width:28px;height:28px;border-radius:50%;background:var(--p2);border:1px solid var(--b);flex:none}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--b)}
.srch{flex:1;display:flex;gap:8px;align-items:center;border:1px solid var(--b);background:var(--p);border-radius:8px;padding:9px 12px;color:var(--m);text-align:left}
.srch kbd{margin-left:auto;font-size:10px}
.ib{width:34px;height:34px;border:1px solid var(--b);border-radius:8px;display:grid;place-items:center;background:var(--p)}
.scroll{flex:1;overflow-y:auto;padding:0 16px 20px}
.hero{position:relative;margin:14px 0;border-radius:12px;padding:22px;min-height:130px;overflow:hidden;border:1px solid var(--b);background:linear-gradient(180deg,#0e2a30,#0a1618 70%)}
.hero:before{content:"";position:absolute;inset:auto 0 0 0;height:75%;background:linear-gradient(135deg,transparent 40%,#3a2a1e 41%,#5b3a22 55%,transparent 56%),linear-gradient(225deg,transparent 35%,#2e2a2a 36%,#4a3624 58%,transparent 59%);opacity:.7}
.hero>*{position:relative}.hero h1{font-size:22px;margin-bottom:6px}.hero p{color:#b9cccb}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa .go,.card{border:1px solid var(--b);background:var(--p);border-radius:10px}
.qa .go{padding:12px;text-align:left}.qa b{display:block}.qa small{color:var(--m)}.qa svg{color:var(--o);display:block;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{padding:12px;min-height:150px}.card h3{font-size:13px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid #12292a;color:#b9cccb}.row:last-child{border:0}.row em{font-style:normal;color:var(--m)}
.empty{color:var(--m);padding:22px 6px;text-align:center}
.cmd{margin-top:14px;border:1px solid #1f5b55;background:var(--p);border-radius:12px;padding:10px 12px}
.cmd label{font-size:11px;color:var(--g)}
.cmd textarea{display:block;width:100%;min-height:46px;max-height:180px;resize:none;background:transparent;border:0;color:var(--t);outline:0;padding:8px 0;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.tools{display:flex;gap:6px;align-items:center}.tools .ib{background:var(--p2);width:32px;height:32px}
.tools .ib.on{border-color:#e33;color:#e33}.tools .ib:hover{border-color:var(--g)}
.send{margin-left:auto;width:36px!important;height:36px!important;border-radius:50%!important;background:var(--o)!important;color:#000;border:0!important;opacity:.45}.send.ready{opacity:1}
.chip{font-size:11px;color:var(--m);margin:2px 0 6px;overflow-wrap:anywhere}
.ev{margin-top:14px}
.msg{max-width:80%;padding:10px 12px;border-radius:12px;margin:8px 0 8px auto;background:#103033;border:1px solid #1f5b55;overflow-wrap:anywhere;white-space:pre-wrap}
.bar{display:none}
.ov{position:fixed;inset:0;background:#000b;display:none;justify-content:center;align-items:flex-start;padding:12vh 14px;z-index:9}.ov.show{display:flex}
.ov .box{background:var(--p);border:1px solid var(--b);border-radius:12px;width:100%;max-width:520px;padding:12px;max-height:70vh;overflow:auto}
.ov input{width:100%;background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:10px;color:var(--t);margin-bottom:8px;font-size:14px}
@media(max-width:1023px){.app{grid-template-columns:150px 1fr}.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:1/-1}.qa{grid-template-columns:repeat(2,1fr)}}
@media(max-width:699px){.app{grid-template-columns:1fr;padding-bottom:64px}.side,.srch kbd,.ev{display:none}.grid{grid-template-columns:1fr}.grid .card:last-child{grid-column:auto}
.qa{grid-template-columns:repeat(3,1fr)}.qa .go:nth-child(2){display:none}.qa .go{text-align:center;padding:10px 4px}.qa small{display:none}.qa svg{margin:0 auto 6px}.hero{min-height:110px}
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#071213f2;border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;align-items:center;z-index:5}
.bar button{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--m);gap:3px;flex:1}.bar button.on{color:var(--o)}
.bar .plus{flex:none;width:46px;height:46px;border-radius:50%;background:var(--o);color:#000;margin-top:-18px;display:grid;place-items:center}}
</style></head><body>
<div class="app"><nav class="side" id="side"></nav>
<div class="main"><div class="top"><button class="srch" id="sbtn"></button><button class="ib go" data-go="Security" id="bell"></button></div><div class="scroll" id="view"></div></div></div>
<div class="bar" id="bar"></div>
<div class="ov" id="ov"><div class="box"><input id="sin" placeholder="Search FORGE..."><div id="sres"></div></div></div>
<input type="file" id="file" hidden>
<script>
const P={home:"M3 11l9-8 9 8v10h-6v-6H9v6H3z",folder:"M3 6h6l2 2h10v11H3z",term:"M4 5h16v14H4zM8 10l3 2-3 2M13 15h4",graph:"M6 6h.01M18 6h.01M12 18h.01M6 6l6 12 6-12",code:"M9 8l-4 4 4 4M15 8l4 4-4 4",agents:"M12 4a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM5 20c0-4 3-6 7-6s7 2 7 6",data:"M5 6c0-1.5 3-2.5 7-2.5s7 1 7 2.5-3 2.5-7 2.5S5 7.5 5 6zM5 6v12c0 1.5 3 2.5 7 2.5s7-1 7-2.5V6",build:"M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8",deploy:"M12 3v3M12 18v3M3 12h3M18 12h3M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z",sec:"M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z",mkt:"M4 8h16l-1 12H5zM8 8a4 4 0 018 0",art:"M4 20l4-1 11-11-3-3L5 16zM14 6l3 3",set:"M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4",search:"M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4",bell:"M6 17v-6a6 6 0 0112 0v6l2 2H4zM10 21h4",clip:"M20 11l-8 8a5 5 0 01-7-7l8-8a3.5 3.5 0 015 5l-8 8a2 2 0 01-3-3l7-7",mic:"M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM6 11a6 6 0 0012 0M12 17v4",send:"M5 12h14M13 6l6 6-6 6",plus:"M12 5v14M5 12h14",more:"M5 12h.01M12 12h.01M19 12h.01",anvil:"M3 9h14c0 3-2 4-5 4v3h4v3H8v-3h4v-3C8 13 4 12 3 9zM17 9h4"};
const I=n=>`<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const NAV=[["Home","home"],["Projects","folder"],["Command","term"],["Work Graph","graph"],["Code","code"],["Agents","agents"],["Data","data"],["Build","build"],["Deploy / Runtime","deploy"],["Security","sec"],["Marketplace","mkt"],["Creative","art"],["Settings","set"]];
const SYS=["Forge Core","AI Agents","Build System","Deployment","Database"];
let cur="Home",msgs=[],att="",draft="",rec=null;const $=s=>document.querySelector(s);
const empty=t=>`<div class="empty">${t}</div>`;
const cmdBox=()=>`<div class="cmd"><label>Command</label><textarea id="ci" rows="1" placeholder="Describe what you want to build, or type a command...">${draft}</textarea><div class="chip" id="chip"></div><div class="tools"><button class="ib" id="att" title="Attach">${I("clip")}</button><button class="ib" id="mic" title="Voice to text">${I("mic")}</button><button class="ib send" id="snd" title="Send">${I("send")}</button></div></div>`;
const home=()=>`<div class="hero"><h1>Good morning</h1><p>Your workspace is ready. What would you like to build today?</p></div>
<div class="qa"><button class="go" data-go="Projects">${I("plus")}<b>Create Project</b><small>Start a new project</small></button><button class="go" data-go="Projects">${I("folder")}<b>Open Workspace</b><small>Switch or open</small></button><button class="go" data-go="Command">${I("term")}<b>Run Command</b><small>Execute a task</small></button><button class="go" data-go="Agents">${I("agents")}<b>Explore Agents</b><small>AI agents & tools</small></button></div>
<div class="grid"><div class="card"><h3>Active Projects</h3>${empty("No projects yet")}</div><div class="card"><h3>System Status</h3>${SYS.map(s=>`<div class="row">${s}<em>-</em></div>`).join("")}</div><div class="card"><h3>Recent Activity</h3>${empty("No activity yet")}</div></div>
${cmdBox()}<div class="card ev"><h3>Recent Events</h3>${empty("No events yet")}</div>`;
const chat=()=>`<h2 style="margin:16px 0">Command</h2>${msgs.length?msgs.map(m=>`<div class="msg">${m}</div>`).join(""):empty("No commands yet")}${cmdBox()}`;
function render(){const v=$("#view");v.innerHTML=cur=="Home"?home():cur=="Command"?chat():`<h2 style="margin:16px 0">${cur}</h2><div class="card">${empty("Nothing here yet")}</div>`;v.scrollTop=0;
$("#sbtn").innerHTML=I("search")+"<span>Search anything in FORGE...</span><kbd>Ctrl K</kbd>";$("#bell").innerHTML=I("bell");
$("#side").innerHTML=`<div class="logo">${I("anvil")}FORGE</div>`+NAV.map(n=>`<button class="ni go ${n[0]==cur?"on":""}" data-go="${n[0]}">${I(n[1])}${n[0]}</button>`).join("")+`<div class="sw"><div class="go" data-go="Settings">Workspace<small>-</small></div><div class="go" data-go="Projects">Project<small>-</small></div><div class="user"><div class="av"></div>Account</div></div>`;
const T=[["Home","home"],["Projects","folder"],["+"],["Command","term"],["More","more"]];
$("#bar").innerHTML=T.map(t=>t[0]=="+"?`<button class="plus" data-go="Projects">${I("plus")}</button>`:`<button class="${t[0]==cur?"on":""}" data-go="${t[0]}">${I(t[1])}${t[0]}</button>`).join("");
const ci=$("#ci");if(ci){$("#snd").onclick=send;$("#att").onclick=()=>$("#file").click();$("#mic").onclick=mic;ci.oninput=fit;ci.onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();send()}};chip();fit()}}
function fit(){const c=$("#ci");c.style.height="auto";c.style.height=Math.min(c.scrollHeight,180)+"px";draft=c.value;$("#snd").classList.toggle("ready",!!(draft.trim()||att))}
function chip(msg){const c=$("#chip");if(c)c.textContent=msg||(att?"Attached: "+att:"")}
function send(){const c=$("#ci");const t=c.value.trim();if(!t&&!att)return;msgs.push((att?"["+att+"]\n":"")+t.replace(/</g,"&lt;"));att="";draft="";cur="Command";render()}
$("#file").onchange=e=>{att=e.target.files[0]?e.target.files[0].name:"";chip();fit()};
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){chip("Voice input is not supported in this browser");return}const b=$("#mic");if(rec){rec.stop();return}rec=new R();rec.continuous=true;rec.onresult=e=>{const c=$("#ci");c.value+=(c.value&&!c.value.endsWith(" ")?" ":"")+e.results[e.results.length-1][0].transcript;fit()};rec.onend=()=>{rec=null;const m=$("#mic");if(m)m.classList.remove("on")};rec.onerror=()=>chip("Microphone unavailable");b.classList.add("on");rec.start()}
function openOv(){$("#ov").classList.add("show");$("#sin").value="";$("#sin").focus();list()}
function list(){const q=$("#sin").value.toLowerCase();$("#sres").innerHTML=NAV.filter(n=>n[0].toLowerCase().includes(q)).map(n=>`<button class="ni go" data-go="${n[0]}">${I(n[1])}${n[0]}</button>`).join("")||empty("No results")}
function go(n){if(n=="More"){openOv();return}if(rec)rec.stop();cur=NAV.some(x=>x[0]==n)?n:"Home";render()}
$("#sin").oninput=list;$("#sbtn").onclick=openOv;
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key=="k"){e.preventDefault();openOv()}if(e.key=="Escape")$("#ov").classList.remove("show")});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){$("#ov").classList.remove("show");go(g.dataset.go)}else if(e.target.id=="ov")$("#ov").classList.remove("show")});
render();
</script></body></html>
