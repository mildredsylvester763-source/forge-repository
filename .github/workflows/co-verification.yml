name: CO focused verification

on:
  push:
    branches:
      - mistral
    paths:
      - 'src/kernel/**'
      - 'src/modules/identity/**'
      - 'tsconfig.co.json'
      - 'test/co-065-atomic-signout.test.ts'
      - 'test/co-065-postgres-uow.test.ts'
      - 'test/sqlite-pool.ts'
      - 'test/co-091-readiness.test.ts'
      - 'test/co-030-route-auth.test.ts'
      - 'test/backup.test.ts'
      - 'test/rate-limit.test.ts'
      - 'test/identity-throttle.test.ts'
      - '.github/workflows/co-verification.yml'
  pull_request:
    branches:
      - mistral

permissions:
  contents: read

jobs:
  co-focused:
    runs-on: ubuntu-latest
    env:
      FORGE_TEST_POSTGRES_URL: ${{ secrets.FORGE_TEST_POSTGRES_URL }}
      FORGE_TEST_POSTGRES_SSL: ${{ vars.FORGE_TEST_POSTGRES_SSL || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Typecheck the isolated CO kernel and identity slice
        run: npx tsc -p tsconfig.co.json --noEmit
      - name: Run independent CO kernel and identity regressions
        run: |
          node --test \
            test/co-065-atomic-signout.test.ts \
            test/co-065-postgres-uow.test.ts \
            test/co-030-route-auth.test.ts \
            test/co-091-readiness.test.ts \
            test/backup.test.ts \
            test/rate-limit.test.ts \
            test/identity-throttle.test.ts
